.aurora i:nth-child(3) { width: 55vmax; height: 55vmax; left: 5vw; bottom: -35vmax; background: radial-gradient(circle, #9a4f3c, transparent 62%); animation-delay: -27s; opacity: .45; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.hours-axis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.thinking { display: flex; align-items: center; gap: 14px; }
.orb { width: 44px; height: 44px; border-radius: 50%; flex: none; background: conic-gradient(from 0deg, transparent 0 65%, var(--warm) 90%, transparent); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); animation: spin 1.4s linear infinite; }

.gap { padding: 16px 18px; border-radius: 18px; background: rgba(255, 207, 158, .08); border: 1px solid rgba(255, 207, 158, .3); color: var(--ink-2); font-size: .94rem; }
.gap b { color: var(--warm); }
.avatar { width: var(--s, 110px); height: var(--s, 110px); border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--edge-hi); background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.25), rgba(255,255,255,.04)); font: 600 calc(var(--s, 110px) * .38)/1 var(--serif); color: var(--warm); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.photo-pick { display: flex; align-items: center; gap: 16px; }

/* 对话 */
.talk { height: 100%; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 10px; padding: 7px; border-radius: 999px; }
.bar .t { flex: 1; min-width: 0; text-align: center; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar .t small { display: block; font-weight: 400; font-size: .72rem; color: var(--ink-3); letter-spacing: .05em; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding-block: 8px; }
.portrait { --level: 0; position: relative; width: min(58vw, 30vh, 280px); aspect-ratio: 1; max-width: 100%; }
.portrait .avatar { --s: 100%; font-size: clamp(3.5rem, 22vw, 7.5rem); position: relative; z-index: 2; box-shadow: 0 30px 80px -20px rgba(0,0,0,.85); animation: breathe 7s ease-in-out infinite; }
.portrait .halo { position: absolute; inset: -16%; border-radius: 50%; z-index: 1; background: radial-gradient(circle, rgba(255,196,150,.45), rgba(183,156,255,.18) 45%, transparent 70%); filter: blur(18px); opacity: .5; transition: opacity .3s; }
.portrait .ring { position: absolute; inset: -5%; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.14); z-index: 1; }
.portrait .ring::before { content: ''; position: absolute; inset: -1.5px; border-radius: 50%; opacity: 0; transition: opacity .3s; background: conic-gradient(from 0deg, transparent 0 70%, rgba(255,207,158,.95) 88%, transparent); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); animation: spin 1.6s linear infinite; }
.s-thinking .portrait .ring::before { opacity: 1; }
.s-speaking .portrait .halo { opacity: 1; animation: pulse .9s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.012); } }
@keyframes pulse { 50% { transform: scale(1.1); } }
.caption { width: 100%; max-height: 34vh; overflow-y: auto; text-align: center; font: 500 clamp(1.2rem, 4.6vw, 1.5rem)/1.65 var(--sans); letter-spacing: .03em; text-shadow: 0 2px 18px rgba(0,0,0,.6); scrollbar-width: none; min-height: 3.3em; }
.caption .me { display: block; font-size: .78em; color: var(--ink-3); font-weight: 400; margin-bottom: 8px; }
.caption .err { display: block; color: var(--danger); font-size: .78em; margin-top: 8px; }
.compose { display: flex; gap: 10px; padding: 8px; border-radius: 999px; align-items: center; }
.compose .input { border-radius: 999px; min-height: 58px; font-size: 1.05rem; }
.compose .btn.primary { width: 58px; height: 58px; min-height: 0; padding: 0; flex: none; }
.tag-ai { font-size: .74rem; color: var(--ink-3); text-align: center; margin-top: 8px; }

.scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(3, 4, 10, .62); animation: enter .2s ease; }
.sheet { width: 100%; max-width: 540px; max-height: 84vh; overflow-y: auto; padding: 24px 20px; background: var(--glass-solid); display: flex; flex-direction: column; gap: 14px; }
.hotlines { display: grid; gap: 8px; }
.hotlines div { display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.05); }
.hotlines b { color: var(--warm); user-select: all; letter-spacing: .04em; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 80; width: min(92vw, 480px); padding: 14px 18px; background: var(--glass-solid); border-radius: 18px; animation: enter .3s ease; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (prefers-reduced-transparency: reduce) { .glass, .btn { background: #171926; -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (max-width: 420px) { .fact { padding: 12px 10px; } .fact .v { font-size: 1.25rem; } }
</style>

<script type="module">
// ===== 共享代码：与 App 同一份（构建时注入）=====

// ===== 原型页 =====
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const I = {

  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  sound: '<path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.7"/>',

  basics: { callName: '', gender: 'female', photo: null },

};

// ========== 第 0 屏：欢迎 ==========
function viewWelcome() {
  const last = ls.get('profile');
  $app.innerHTML = `
  <section class="screen">
    <header class="hero">
      <h1>念念</h1>
      <p>导入和 TA 的微信聊天记录，留住 TA 说话的样子。</p>

    </div>
    <div class="privacy glass">${icon('lock')}<span>聊天记录只在你的浏览器里解析，原文不会上传、也不会保存。只有挑出来的一小部分 TA 的消息（手机号、卡号等已自动隐藏）会交给 Claude 分析说话方式。</span></div>

      <summary>怎么把微信聊天记录拿出来？</summary>

        <li><b>最简单（电脑版微信）：</b>打开和 TA 的聊天，按住 Shift 点选一段消息 → 右键「复制」，或者多选后「合并转发」给自己再复制，然后粘贴到上面。适合几百条以内。</li>
        <li><b>手机上：</b>长按一条消息 →「多选」→ 勾选 →「合并转发」到「文件传输助手」，在电脑上打开后复制粘贴。</li>
        <li><b>全部记录：</b>有第三方工具可以把电脑版微信的聊天导出成 TXT / CSV。<span class="warn">这类工具要解密微信数据库，不是微信官方功能，可能违反微信用户协议，也有泄露隐私的风险。</span>只在自己的电脑、自己的账号上用，用完删掉导出文件。</li>

function loadText(text, label) {
  if (/<html|<body|<div/i.test(text.slice(0, 2000))) {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    text = doc.body.innerText || doc.body.textContent || '';
  }
  const parsed = parseWeChat(text);
  if (parsed.messages.length < 5 || parsed.senders.length < 1) {
    toast('<b class="warn">没能认出聊天格式。</b>请确认每条消息带有「时间 + 名字」，或换一种导出格式。', 6000);
    return;

  viewWho();
}

async function shrink(file, max = 480) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .85);
  } finally { URL.revokeObjectURL(url); }
}

const voice = {
  q: [], busy: false, onIdle: () => {},
  say(text) {
    if (S.muted || !window.speechSynthesis || !text.trim()) return;
    this.q.push(text);
    if (!this.busy) this.next();
  },
  next() {
    const t = this.q.shift();
    if (!t) { this.busy = false; this.onIdle(); return; }
    this.busy = true;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN';
    const v = speechSynthesis.getVoices().filter((x) => /^zh[-_]CN/i.test(x.lang));
    if (v.length) u.voice = v.find((x) => x.localService) || v[0];
    u.rate = .95;
    u.pitch = S.basics.gender === 'male' ? .85 : 1.05;
    const guard = setTimeout(() => this.next(), 2000 + t.length * 400);
    u.onend = u.onerror = () => { clearTimeout(guard); this.next(); };
    speechSynthesis.speak(u);
  },
  stop() { this.q = []; this.busy = false; try { speechSynthesis.cancel(); } catch {} },
};

  $app.innerHTML = `

      <input class="input" id="msg" autocomplete="off" enterkeyhint="send" placeholder="想对${name}说什么…">

    </form>
    <p class="tag-ai">原型：对话用 Claude 生成；声音用设备自带的朗读。</p>
  </div>`;
  const $talk = $app.querySelector('#talk');
  const $cap = $app.querySelector('#cap');
  const $msg = $app.querySelector('#msg');
  let ctl = null;
  const setState = (s) => { $talk.className = `talk s-${s}`; };
  voice.onIdle = () => setState('idle');

  const fallbackReply = () => {
    const c = S.profile.catchphrases;
    const pickOne = c.length ? c[Math.floor(Math.random() * c.length)] : '嗯，我在呢';
    return `${pickOne}。（要在 Claude 里打开这个页面，我才能真正回答你。）`;
  };

  async function ask(userText) {
    voice.stop();
    ctl?.abort();
    ctl = new AbortController();
    setState('thinking');
    if (userText) S.turns.push({ role: 'user', content: userText });
    const head = userText ? `<span class="me">你：${esc(userText)}</span>` : '';
    $cap.innerHTML = head + '<span class="faint">…</span>';
    let said = '';
    let reply = '';
    const flushSentences = (text, final) => {
      const rest = text.slice(said.length);
      const m = final ? [rest] : rest.match(/^[\s\S]*[。！？!?…~～\n]/);
      if (m && m[0].trim()) { voice.say(m[0].trim()); said += m[0]; }
    };
    try {
      await sampleReady;
      if (!sample) throw { code: 'unavailable' };
      const greeting = !userText;
      const first = { role: 'user', content: rules + (greeting ? `\n\n【提示（不是家人说的话）：${S.other || '家人'}刚刚来看你。请你先开口，像平时那样打个招呼，一两句话。】` : '') };
      const input = [first, ...S.turns].reduce((acc, t) => {
        const last = acc[acc.length - 1];
        if (last && last.role === t.role) last.content += '\n\n' + t.content; else acc.push({ ...t });
        return acc;
      }, []);
      const { text } = await sample(input, {
        modelTier: 'quick', cache: false, signal: ctl.signal,
        onText: ({ text }) => { reply = text; $cap.innerHTML = head + esc(text); $cap.scrollTop = $cap.scrollHeight; flushSentences(text, false); },
      });
      reply = text.trim();
      flushSentences(reply, true);
    } catch (e) {
      if (e?.code === 'cancelled') return;
      reply = e?.code === 'unavailable' ? fallbackReply() : '';
      if (!reply) { $cap.innerHTML = head + `<span class="err">${errText(e)}</span>`; setState('idle'); if (userText) S.turns.pop(); return; }
      $cap.innerHTML = head + esc(reply);
      voice.say(reply.replace(/（[^）]*）$/, ''));
    }
    S.turns.push({ role: 'assistant', content: reply });
    if (S.turns.length > 40) S.turns = S.turns.slice(-40);
    setState(voice.busy ? 'speaking' : 'idle');
    if (voice.busy) setState('speaking');
  }

  $app.querySelector('#form').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $msg.value.trim();
    if (!t) return;
    $msg.value = '';
    if (CARE_RE.test(t)) showCare();
    ask(t);
  });
  $app.querySelector('#back').onclick = () => { voice.stop(); ctl?.abort(); viewReview(); };
  $app.querySelector('#mute').onclick = (e) => {
    S.muted = !S.muted;
    ls.set('profile', { ...(ls.get('profile') || {}), muted: S.muted });
    if (S.muted) voice.stop();
    e.currentTarget.innerHTML = icon(S.muted ? 'mute' : 'sound');
    toast(S.muted ? '已静音，只显示文字' : '声音已打开', 1600);
  };
  $app.querySelector('#info').onclick = () => {
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    const p = S.profile;
    scrim.innerHTML = `<div class="sheet glass" role="dialog" aria-modal="true">
      <h2>${esc(S.who)}的资料</h2>
      <p class="faint">这些都来自聊天记录和你的核对。完整版 App 里可以继续补充、保存新的回忆。</p>
      ${p.catchphrases.length ? `<h3>口头禅</h3><div class="chips">${p.catchphrases.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
      ${p.personality ? `<h3>性格</h3><p class="muted">${esc(p.personality)}</p>` : ''}
      ${p.speakingStyle ? `<h3>说话的样子</h3><p class="muted">${esc(p.speakingStyle)}</p>` : ''}
      <h3>记得的事</h3>${S.memories.filter((m) => m.on).map((m) => `<p class="muted">· ${esc(m.text)}</p>`).join('') || '<p class="faint">还没有。</p>'}
      <button class="btn block" id="close">关闭</button></div>`;
    scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.id === 'close') scrim.remove(); });
    document.body.append(scrim);
  };
  setState('idle');
  ask(null); // TA 先开口
}

// 启动
viewWelcome();
</script>
